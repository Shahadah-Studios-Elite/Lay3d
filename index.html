<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lays 3D Simulator - Shahadah Studios Elite</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #0f172a; font-family: monospace; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: rgba(242, 205, 55, 0.8);
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #fff; font-size: 24px; text-shadow: 2px 2px #000; z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">🥔 Chips Eaten: <span id="counter">0</span></div>
    
    <!-- This links directly to your TypeScript file -->
    <script type="module" src="/game.ts"></script>
</body>
</html>
